services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - quiz-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DB_DSN: "${DB_USER}:${DB_PASSWORD}@tcp(db:3306)/quiz?parseTime=true&multiStatements=true"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
    ports:
      - "8081:${API_PORT}"
    networks:
      - quiz-net
    restart: on-failure

volumes:
  db_data:

networks:
  quiz-net:
    driver: bridge
