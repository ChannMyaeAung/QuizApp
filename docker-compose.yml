services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quiz
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - quiz-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DB_DSN: "root:root@tcp(db:3306)/quiz?parseTime=true&multiStatements=true"
      JWT_SECRET: "devsecret"
    depends_on:
      - db
    ports:
      - "8081:8080"
    networks:
      - quiz-net
    restart: on-failure

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      # Inside the web container, the api service is reachable at http://api:8080
      NEXT_PUBLIC_API_URL: "http://api:8080"
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - quiz-net

volumes:
  db_data:

networks:
  quiz-net:
    driver: bridge
