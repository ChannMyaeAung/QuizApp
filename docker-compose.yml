services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizapp}
      POSTGRES_USER: ${POSTGRES_USER:-quizapp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizapp_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - quiz-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-quizapp_user} -d ${POSTGRES_DB:-quizapp}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-quizapp_user}:${POSTGRES_PASSWORD:-quizapp_password}@db:5432/${POSTGRES_DB:-quizapp}?sslmode=disable"
      PORT: ${API_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    networks:
      - quiz-net
    restart: on-failure

volumes:
  db_data:

networks:
  quiz-net:
    driver: bridge
