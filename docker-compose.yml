version: "3.9"
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quiz
    ports:
      - "3306:3306"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
  api:
    build: ./api
    environment:
      DB_DSN: "root:root@tcp(db:3306)/quiz?parseTime=true&multiStatements=true"
      JWT_SECRET: "devsecret"
    depends_on:
      - db
    ports:
      - "8080:8080"
  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      - api
    ports:
      - "3000:3000"
